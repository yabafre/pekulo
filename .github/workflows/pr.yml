name: pr
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  # L8: Prisma 7's defineConfig evaluates env("DATABASE_URL") at config-load time,
  # which fires on every `bun install` (apps/api postinstall = `prisma generate`)
  # and every `prisma format/validate/generate` invocation. Workflow-level stub
  # satisfies the loader for jobs that only do schema-text work; rls-audit
  # overrides this at the step level with the real RLS_AUDIT_DATABASE_URL secret
  # when configured.
  DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: oxlint
        run: bun run lint

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: oxfmt --check
        run: bun run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: tsc --noEmit (turbo)
        run: bun run typecheck -- --summarize
      - name: Upload turbo summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-summary
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7

  prisma-check:
    name: prisma-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: prisma format --check && prisma validate
        run: bun run prisma:check

  rls-audit:
    name: rls-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: rls-audit (skip if RLS_AUDIT_DATABASE_URL unset)
        env:
          RLS_AUDIT_DATABASE_URL: ${{ secrets.RLS_AUDIT_DATABASE_URL }}
        run: |
          if [ -z "$RLS_AUDIT_DATABASE_URL" ]; then
            echo "skip: RLS_AUDIT_DATABASE_URL not set"
            exit 0
          fi
          DATABASE_URL="$RLS_AUDIT_DATABASE_URL" bun run db:rls-audit

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: vitest (skip if no config)
        run: |
          if [ -z "$(find . -name 'vitest.config.*' -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "skip: vitest.config.* not present"
            exit 0
          fi
          # Use the workspace's `test` script (vitest via per-package
          # config) — `bun test` is Bun's own runner and does NOT execute
          # vitest tests (toMatchInlineSnapshot / vitest-axe / setup files
          # are vitest-specific).
          bun --filter='*' run test

  test-e2e-smoke:
    name: test-e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: playwright @smoke (skip if no config)
        run: |
          if [ ! -f playwright.config.ts ] && [ ! -f playwright.config.js ] && [ ! -f apps/web/playwright.config.ts ]; then
            echo "skip: playwright.config.* not present"
            exit 0
          fi
          bunx playwright install --with-deps chromium
          bunx playwright test --grep @smoke

  lighthouse-ci:
    name: lighthouse-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: lhci autorun (skip if no config)
        run: |
          if [ ! -f lighthouserc.json ] && [ ! -f lighthouserc.cjs ] && [ ! -f apps/web/lighthouserc.json ]; then
            echo "skip: lighthouserc.* not present"
            exit 0
          fi
          bunx --bun @lhci/cli@0.14.x autorun

  axe-a11y:
    name: axe-a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: vitest-axe (skip if no fixture)
        run: |
          if [ -z "$(find . -name '*.axe.test.*' -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "skip: *.axe.test.* fixture not present"
            exit 0
          fi
          bunx vitest run --grep axe

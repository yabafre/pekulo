# Pekulo pre-commit hooks — see docs/stories/0-11-precommit-secrets.md for the rationale.
#
# Hook order matters: gitleaks runs FIRST so a leaking commit is blocked before any auto-fixer
# rewrites the staged content. Auto-fixers run sequentially after, with stage_fixed: true so
# their rewrites land in the same commit.
#
# Bypass for emergencies (DISCOURAGED): LEFTHOOK=0 git commit ...

pre-commit:
  parallel: false
  commands:
    1_gitleaks:
      tags: security
      run: gitleaks git --pre-commit --staged --redact --verbose --config=.gitleaks.toml
      fail_text: |
        🚫 gitleaks detected a potential secret in staged changes.
        Review the report above. If it is a false positive, add the file/regex to
        .gitleaks.toml's [allowlist] block, then re-stage and re-commit.
        Bypass for emergencies (DISCOURAGED): LEFTHOOK=0 git commit ...
    2_oxlint:
      tags: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    3_oxfmt:
      tags: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,md,yml,yaml}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    4_prisma_format:
      tags: format
      glob: "apps/api/prisma/**/*.prisma"
      run: bash -c '(cd apps/api && bun run prisma:format)'
      stage_fixed: true
    5_tamagui_css:
      # Auto-regenerate packages/ui/public/tamagui.generated.css whenever
      # the DS source changes. apps/web's TamaguiProvider runs with
      # `disableInjectCSS` — it reads styles from the pre-generated CSS
      # file, not from runtime injection. Without this hook, any new
      # styled() / variant / theme-token added in packages/ui silently
      # never reaches production CSS until a human remembers to
      # regenerate (see docs/lessons.md 2026-05-24 entry — the symptom
      # was "popover has no background" while typecheck + lint + tests
      # all passed because Tamagui in jsdom uses a different runtime
      # path).
      #
      # Glob is intentionally broad — any .ts(x) under packages/ui/src
      # can affect the generated CSS. The hook explicitly `git add`s
      # the output file (stage_fixed only restages INPUT files; the
      # generated CSS is an OUTPUT, so we add it by hand).
      tags: format
      glob: "packages/ui/src/**/*.{ts,tsx}"
      run: bash -c 'bun run generate:tamagui-css >/dev/null && git add packages/ui/public/tamagui.generated.css'

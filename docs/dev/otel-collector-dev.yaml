# docs/dev/otel-collector-dev.yaml
# Minimal OTel Collector config for story 0-7 AC-2 verification.
# Run: docker run --rm -p 4318:4318 \
#   -v "$(pwd)/docs/dev/otel-collector-dev.yaml:/etc/otelcol-contrib/config.yaml" \
#   otel/opentelemetry-collector-contrib:latest
# Note: the original story prescribed pin 0.115.0 but Docker Hub returns
# 404 for that tag. AC-2 smoke (2026-05-05) verified against `:latest`
# (resolved to 0.151.0 at the time). The config is forward-compatible.
# Production deployments MUST pin a specific tag (e.g. `:0.151.0`) — `:latest`
# here is intentional dev-only.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]

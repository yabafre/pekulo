# Pekulo extends the gitleaks default ruleset.
# See https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Pekulo allowlist — known-safe paths and patterns. Add false-positive rules here, never disable a default rule globally."
# Allowlist scope is intentionally narrow: env-template files only (not arbitrary
# `*.example`), and APED-managed docs subtrees only (not arbitrary `docs/**/*.md`).
# A new docs subdir or non-env example file must be allowlisted explicitly so a
# real leak in a new path gets caught by the default ruleset.
paths = [
  '''(^|.+/)\.env(\..+)?\.example$''',
  '''apps/web/supabase/\.temp/linked-project\.json$''',
  '''^docs/(adr|stories|spikes|quick-specs|ux|ux-preview)/.*\.md$''',
  '''^docs/(architecture|epics|prd|project-context|lessons|grill-summary|epic-\d+-context)\.md$''',
  '''bun\.lock$''',
  # Integration tests under apps/api use intentional 32-char fake JWT secrets
  # (e.g. "integration-secret-at-least-32-chars-long-...") to exercise the
  # jose HS256 signing path without contacting Supabase. The string is local
  # to the test file and never leaves the test harness. Hyphens allowed in the
  # module dir + file stem so hyphenated modules (e.g. bank-aggregator) match;
  # ONE optional dotted segment so a module with several boundary suites
  # (settings.export.integration.test.ts) matches without widening to `.+`.
  '''^apps/api/src/modules/[a-z-]+/[a-z-]+(\.[a-z-]+)?\.integration\.test\.ts$''',
]

name: pr
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  # L8: Prisma 7's defineConfig evaluates env("DATABASE_URL") at config-load time,
  # which fires on every `bun install` (apps/api postinstall = `prisma generate`)
  # and every `prisma format/validate/generate` invocation. Workflow-level stub
  # satisfies the loader for jobs that only do schema-text work; rls-audit
  # overrides this at the step level with the real RLS_AUDIT_DATABASE_URL secret
  # when configured.
  DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: oxlint
        run: bun run lint

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: oxfmt --check
        run: bun run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: tsc --noEmit (turbo)
        run: bun run typecheck -- --summarize
      - name: Upload turbo summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-summary
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7

  prisma-check:
    name: prisma-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: prisma format --check && prisma validate
        run: bun run prisma:check

  # rls-audit: static gate over the committed migration SQL (story 11-3, AC-1).
  # No DB / no RLS_AUDIT_DATABASE_URL secret needed — it parses the migration
  # files and fails if any public user-data table was created without RLS DDL.
  # The DB-backed exact-count probe (scripts/rls-audit.ts) stays a local/
  # post-deploy check, not a CI gate (it needs a provisioned Supabase).
  rls-audit:
    name: rls-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: static RLS migration gate
        run: bun --filter=@pekulo/api run db:rls-migration-audit

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: vitest (skip if no config)
        run: |
          if [ -z "$(find . -name 'vitest.config.*' -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "skip: vitest.config.* not present"
            exit 0
          fi
          # Use the workspace's `test` script (vitest via per-package
          # config) — `bun test` is Bun's own runner and does NOT execute
          # vitest tests (toMatchInlineSnapshot / vitest-axe / setup files
          # are vitest-specific).
          bun --filter='*' run test

  axe-a11y:
    # Route-level WCAG 2.2 AA gate (story 11-4, AC-1 / AC-4 / AC-5 / DR-8).
    # Boots the disposable local Postgres + GoTrue stack (no repo secrets),
    # applies Prisma migrations, builds and starts @pekulo/api (:3001) and
    # @pekulo/web (:3002), and runs @axe-core/playwright in real Chromium
    # across all 7 priority routes × {dark desktop, light desktop, dark mobile}.
    name: axe-a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      DIRECT_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3002"
      API_BASE_URL: "http://127.0.0.1:3001"
      SUPABASE_JWT_SECRET: "local-e2e-jwt-secret-local-e2e-jwt-secret"
      SUPABASE_SERVICE_ROLE_KEY: "sb_secret_e2e_local_placeholder_key"
      BRIDGE_CLIENT_ID: "e2e-bridge-client-id"
      BRIDGE_CLIENT_SECRET: "e2e-bridge-client-secret"
      BRIDGE_WEBHOOK_SIGNING_SECRET: "e2e-bridge-webhook-secret"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start disposable Postgres + GoTrue stack
        run: |
          docker compose -f apps/web/e2e/stack/docker-compose.yml up -d --wait
      - name: Apply Prisma migrations
        run: bun --filter=@pekulo/api run prisma:migrate:deploy
      - name: Mint local anon JWT and build @pekulo/web
        run: |
          ANON_KEY="$(bun -e 'import { mintAnonJwt } from "./apps/web/e2e/e2e-env"; console.log(mintAnonJwt());')"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" bun --filter=@pekulo/web run build
      - name: Boot @pekulo/api and @pekulo/web, then run axe-core suite
        run: |
          bun --filter=@pekulo/api run start &
          API_PID=$!
          bun --filter=@pekulo/web run start &
          WEB_PID=$!
          trap "kill $API_PID $WEB_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health/live >/dev/null && curl -sf http://localhost:3002/login >/dev/null; then
              break
            fi
            sleep 1
          done
          bun --filter=@pekulo/web run test:e2e:axe
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: axe-playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  gitleaks:
    # Secret-scanning backstop. The lefthook pre-commit hook (lefthook.yml)
    # runs gitleaks locally, but it is bypassable with LEFTHOOK=0 (or by a
    # contributor who never ran `lefthook install`). This job re-runs the
    # scan in CI against the same root .gitleaks.toml so a committed secret
    # cannot reach main unnoticed. Uses the official gitleaks action; it
    # auto-detects .gitleaks.toml at the repo root. GITLEAKS_LICENSE is only
    # required for GitHub organisations — omitted here for the personal repo.
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks scans every commit introduced by the PR,
          # not just the tip (shallow checkout would miss secrets buried in
          # intermediate commits).
          fetch-depth: 0
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prices-tests:
    # apps/prices is the Python (FastAPI) yfinance microservice — it lives
    # outside the bun/turbo graph, so its tests are not covered by test-unit.
    # Setup Python, install runtime + dev deps, then run pytest from the
    # service dir (conftest.py primes PRICES_SERVICE_TOKEN at collection time
    # and inserts apps/prices on sys.path, so plain `python -m pytest` boots
    # main.py cleanly without extra env).
    name: prices-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prices
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  tamagui-css-fresh:
    # Belt-and-suspenders for the pre-commit hook (lefthook 5_tamagui_css).
    # apps/web's TamaguiProvider runs with disableInjectCSS and reads
    # styles from packages/ui/public/tamagui.generated.css. If a dev
    # bypassed the pre-commit hook (LEFTHOOK=0) or never installed
    # lefthook, the committed CSS will silently drift from the source.
    # Symptom is invisible until a user reports a "missing background"
    # bug in production. This job re-runs the generation and asserts
    # the committed file matches a fresh regen — fails the PR if drift
    # is detected. See docs/lessons.md 2026-05-24 for the full story.
    name: tamagui-css-fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - name: regenerate tamagui.generated.css then assert no diff
        run: |
          bun run generate:tamagui-css
          if ! git diff --exit-code packages/ui/public/tamagui.generated.css; then
            echo "::error::packages/ui/public/tamagui.generated.css drifted from a fresh regen."
            echo "::error::Run 'bun run generate:tamagui-css' locally, commit the result, push."
            echo "::error::lefthook auto-regens on every packages/ui/src/**/*.tsx change — was the hook bypassed?"
            exit 1
          fi
          echo "tamagui.generated.css matches source — no drift."

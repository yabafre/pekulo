name: maestro-ios
description: >-
  Stories 10-5 / 10-6 — boots the pinned simulator ($IOS_SIMULATOR on $IOS_RUNTIME)
  first so it boots while the pekulo-ios-app artifact and the pinned Maestro CLI
  download, then installs the app and exports SIMULATOR_UDID. Expects
  DEVELOPER_DIR, MAESTRO_VERSION, IOS_SIMULATOR and IOS_RUNTIME in the job environment.
runs:
  using: composite
  steps:
    - name: Start booting the simulator
      shell: bash
      run: |
        set -euo pipefail
        runtime="com.apple.CoreSimulator.SimRuntime.$(echo "$IOS_RUNTIME" | tr ' .' '--')"
        udid="$(xcrun simctl list devices available -j \
          | jq -r --arg rt "$runtime" --arg name "$IOS_SIMULATOR" \
            '.devices[$rt][]? | select(.name == $name) | .udid' | head -1)"
        if [ -z "$udid" ]; then
          echo "::error::No '$IOS_SIMULATOR' simulator for '$IOS_RUNTIME' on this image" >&2
          xcrun simctl list runtimes >&2
          exit 1
        fi
        # `simctl boot` returns once the boot is requested; bootstatus waits later.
        xcrun simctl boot "$udid" || true
        echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v4
      with:
        name: pekulo-ios-app
    - name: Unpack the app
      shell: bash
      run: tar -xzf pekulo-ios.tgz
    - name: Restore Maestro CLI
      uses: actions/cache@v4
      with:
        path: ~/.maestro
        key: maestro-${{ runner.os }}-${{ runner.arch }}-${{ env.MAESTRO_VERSION }}
    - name: Install Maestro CLI
      shell: bash
      run: |
        [ -x "$HOME/.maestro/bin/maestro" ] || curl -fsSL "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
    - name: Wait for boot and install the app
      shell: bash
      run: |
        set -euo pipefail
        xcrun simctl bootstatus "$SIMULATOR_UDID" -b
        xcrun simctl install "$SIMULATOR_UDID" Pekulo.app
